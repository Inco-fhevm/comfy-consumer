services:
  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Runtime app config (see client/.env.sample) — baseSepolia | base
      - APP_CHAIN=${APP_CHAIN:-baseSepolia}
      - APP_INDEXER_URL=${APP_INDEXER_URL}
      - APP_WRAPPER_FACTORY_ADDRESS=${APP_WRAPPER_FACTORY_ADDRESS}
      - APP_COMMON_VAULT_ADDRESS=${APP_COMMON_VAULT_ADDRESS}
      - APP_DEFAULT_TOKENS=${APP_DEFAULT_TOKENS}
      - APP_SESSION_TTL_HOURS=${APP_SESSION_TTL_HOURS}
      - APP_SESSION_VERIFIER=${APP_SESSION_VERIFIER}
      - APP_SUPPORT_URL=${APP_SUPPORT_URL}
      # Logging (Winston → stdout)
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVICE_NAME=${SERVICE_NAME:-comfy-consumer}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Observability: OTel traces push OUT to Grafana. Unset ⇒ no-op.
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-comfy-consumer}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
