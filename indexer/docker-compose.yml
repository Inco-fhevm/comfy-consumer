# Local dev: postgres + the indexer. Ponder backfills from START_BLOCK and then
# follows head; ingestion, reorgs and the RPC cache are all Ponder's job.
# Without a DATABASE_URL the indexer falls back to embedded PGlite, so this
# compose file is only needed if you want a real Postgres locally.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    volumes:
      # Holds ponder_sync (the RPC cache). Keep it — dropping it forces a full
      # re-fetch on the next boot. `compose down -v` will wipe it.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer"]
      interval: 2s
      timeout: 3s
      retries: 20

  indexer:
    build:
      context: ..
      dockerfile: indexer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local           # NETWORK, RPC URLs, START_BLOCK, CORS_ORIGINS
    environment:
      DATABASE_URL: postgres://indexer:indexer@postgres:5432/indexer
      DATABASE_SCHEMA: comfy
      OFFCHAIN_SCHEMA: comfy_offchain
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
